<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuangan AI Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe { border: none; width: 100%; height: calc(100vh - 48px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- FORM LOGIN / REGISTER -->
  <div id="authContainer" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
      <h2 class="text-2xl font-bold mb-6 text-center text-indigo-600">Keuangan AI Pro</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nama Akun</label>
          <input type="text" id="authNama" placeholder="Masukkan nama..." class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="authPassword" placeholder="Masukkan password..." class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button onclick="handleAuth('login')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-xl shadow-lg">Login</button>
        <button onclick="handleAuth('register')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold p-3 rounded-xl">Buat Akun Baru</button>
        <p id="authMessage" class="text-sm text-center font-medium min-h-[20px]"></p>
      </div>
    </div>
  </div>

  <!-- APLIKASI SETELAH LOGIN -->
  <div id="mainAppContainer" class="hidden h-screen flex flex-col">
    <div class="h-[48px] bg-slate-900 text-white px-4 flex justify-between items-center text-xs">
      <span>Pengguna: <strong id="welcomeText" class="text-indigo-400"></strong></span>
      <button onclick="logout()" class="bg-rose-500 hover:bg-rose-600 px-3 py-1.5 rounded font-semibold">Logout</button>
    </div>
    <iframe id="appIframe" src=""></iframe>
  </div>

  <script>
    // MASUKKAN URL WEB APP YANG DIDAPAT DARI LANGKAH 2 DI SINI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzyrEcpvV0TSDvNFg3uYgCdcVznbTNuycZ7Sy3wgRctfYG7-nyOHdByRQUGucHD0aOLEg/exec'; 

    window.onload = function() {
      const savedSheetId = localStorage.getItem('userSheetId');
      const savedName = localStorage.getItem('userName');
      if (savedSheetId && savedName) showMainApp(savedName, savedSheetId);
    };

    async function handleAuth(action) {
      const nama = document.getElementById('authNama').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const msgLabel = document.getElementById('authMessage');

      if (!nama || !password) {
        msgLabel.innerText = "Nama dan password tidak boleh kosong!";
        msgLabel.className = "text-sm text-center font-medium text-rose-500";
        return;
      }

      msgLabel.innerText = action === 'login' ? "Memeriksa data..." : "Membuat spreadsheet akun...";
      msgLabel.className = "text-sm text-center font-medium text-indigo-500";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, nama: nama, password: password })
        });
        
        const result = await response.json();

        if (result.status === 'success') {
          localStorage.setItem('userSheetId', result.sheetId);
          localStorage.setItem('userName', nama);
          showMainApp(nama, result.sheetId);
        } else {
          msgLabel.innerText = result.message;
          msgLabel.className = "text-sm text-center font-medium text-rose-500";
        }
      } catch (error) {
        msgLabel.innerText = "Gagal terhubung ke server.";
        msgLabel.className = "text-sm text-center font-medium text-rose-500";
      }
    }

    function showMainApp(userName, sheetId) {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('mainAppContainer').classList.remove('hidden');
      document.getElementById('welcomeText').innerText = userName;
      document.getElementById('appIframe').src = SCRIPT_URL + "?sheetId=" + (sheetId || '');
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }
  </script>
</body>
</html>
